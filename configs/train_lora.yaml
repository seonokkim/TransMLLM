model:
  base_model: "llava-hf/llava-v1.6-mistral-7b-hf"
  lora_rank: 16
  lora_alpha: 32
  lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

training:
  output_dir: "./checkpoints/transmllm_lora"
  num_train_epochs: 3
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 1e-5
  lr_scheduler_type: "cosine"
  warmup_steps: 10
  logging_steps: 10
  save_steps: 50
  evaluation_strategy: "steps"
  eval_steps: 50
  save_total_limit: 3
  bf16: true
  gradient_checkpointing: true
  dataloader_num_workers: 4

data:
  # HuggingFace dataset (images are embedded, automatically cached to ~/.cache/huggingface/datasets/)
  dataset_name: "rileykim/multilingual-document"
  # Alternative: Use local JSONL file (requires images_dir)
  # train_data_path: "./data/multilingual_document/train/en-zh-cn.jsonl"
  # images_dir: "./data/multilingual_document/train/images"
  val_data_path: null  # Optional validation set (local JSONL path)
  max_length: 2048
  image_size: 1024

