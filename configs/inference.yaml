model:
  model_path: "./checkpoints/transmllm_lora"  # Path to trained model
  base_model: "llava-hf/llava-v1.6-mistral-7b-hf"  # Base model if loading LoRA

inference:
  image_size: 1024
  max_length: 2048
  temperature: 0.7
  top_p: 0.9
  do_sample: true

data:
  source_lang: "en"
  target_lang: "kk"
  image_path: "./examples/sample_data/multilingual-document/00.jpg"
  output_path: "./outputs/translation.txt"

